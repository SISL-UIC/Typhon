name: Build docs (doc.typhondb.io)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v5
    - name: Verify generated telemetry reference is up to date
      run: python3 scripts/gen-telemetry-reference.py --check
    - name: Verify docs-affected map integrity (no stale entries)
      run: python3 scripts/docs-affected.py --validate
    - name: Verify doc links and cited source paths resolve
      run: python3 scripts/check-doc-links.py
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore pinned DocFX (parity with local build)
      run: dotnet tool restore
    - name: Build Shell (API assemblies + XML docs + transitive deps)
      run: dotnet build src/Typhon.Shell -c Release
    - name: Build docs (stage API -> docfx metadata into api/ref + build)
      shell: bash
      run: |
        set -o pipefail                       # without this, tee's exit code would mask a docfx failure
        sh scripts/build-docs.sh Release 2>&1 | tee /tmp/docfx.log
    - name: Gate on broken links / unresolved xrefs
      shell: bash
      run: |
        if grep -nE "InvalidFileLink|InvalidBookmark|UidNotFound|InvalidXref" /tmp/docfx.log; then
          echo "::error::Docs contain broken links or unresolved xrefs (listed above). Reproduce locally with: sh scripts/build-docs.sh Release"
          exit 1
        fi
        echo "Link/xref integrity: clean."
    - name: Assemble /latest tree + CNAME + root redirect + robots
      run: "mkdir -p _publish/latest\ncp -r doc/_site/* _publish/latest/\n# llms.txt\
        \ must sit at the HOST ROOT \u2014 coding agents probe /llms.txt on the\n\
        # domain, not under /latest/. (build-docs.sh emitted it into doc/_site, so\
        \ a\n# copy also rides along under /latest/ \u2014 harmless; some agents probe\
        \ both.)\ncp doc/_site/llms.txt _publish/llms.txt\necho \"doc.typhondb.io\"\
        \ > _publish/CNAME\nprintf '<!doctype html><meta charset=\"utf-8\"><title>Typhon\
        \ Documentation</title><meta http-equiv=\"refresh\" content=\"0; url=/latest/\"\
        ><a href=\"/latest/\">Typhon Documentation</a>' > _publish/index.html\n# robots.txt\
        \ must sit at the HOST root (crawlers only read /robots.txt); DocFX emits\n\
        # sitemap.xml inside the site bundle, which lands under /latest/, so point\
        \ there.\nprintf 'User-agent: *\\nAllow: /\\n\\nSitemap: https://doc.typhondb.io/latest/sitemap.xml\\\
        n' > _publish/robots.txt\ntouch _publish/.nojekyll\n"
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _publish
    timeout-minutes: 6
  deploy:
    if: ${{ !cancelled() && (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
    paths:
    - doc/**
    - src/**/*.cs
    - src/**/*.csproj
    - benchmark/reports/**
    - scripts/build-docs.sh
    - scripts/stage-api-bin.sh
    - .config/dotnet-tools.json
    - .github/workflows/build-docs.yml
    - coverage/docs-affected-map.json
    - scripts/docs-affected.py
    - scripts/check-doc-links.py
  pull_request:
    branches:
    - main
    paths:
    - doc/**
    - src/**/*.cs
    - src/**/*.csproj
    - benchmark/reports/**
    - scripts/build-docs.sh
    - scripts/stage-api-bin.sh
    - .config/dotnet-tools.json
    - .github/workflows/build-docs.yml
    - coverage/docs-affected-map.json
    - scripts/docs-affected.py
    - scripts/check-doc-links.py
  workflow_dispatch: null
